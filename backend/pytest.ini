[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    -n auto
    --cov=app
    --cov-report=term-missing
    --cov-report=html:../reports/coverage/backend
    --cov-report=json:../reports/coverage/backend/coverage.json
    --cov-fail-under=80
    --junitxml=../reports/junit/backend-results.xml
asyncio_mode = auto
