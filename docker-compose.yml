version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mtbf_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mtbf}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtbf_network

  redis:
    image: redis:7-alpine
    container_name: mtbf_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtbf_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtbf_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mtbf}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mtbf_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: mtbf_worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mtbf}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - KPI_ROLLING_SCHEDULE_MINUTE=${KPI_ROLLING_SCHEDULE_MINUTE:-*}
      - KPI_ROLLING_SCHEDULE_HOUR=${KPI_ROLLING_SCHEDULE_HOUR:-*}
      - KPI_CALENDAR_SCHEDULE_MINUTE=${KPI_CALENDAR_SCHEDULE_MINUTE:-0}
      - KPI_CALENDAR_SCHEDULE_HOUR=${KPI_CALENDAR_SCHEDULE_HOUR:-0}
      - KPI_BATCH_SIZE=${KPI_BATCH_SIZE:-100}
    volumes:
      - ./worker:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mtbf_network
    command: celery -A worker.celery_app worker --loglevel=info

  scheduler:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: mtbf_scheduler
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mtbf}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - KPI_ROLLING_SCHEDULE_MINUTE=${KPI_ROLLING_SCHEDULE_MINUTE:-*}
      - KPI_ROLLING_SCHEDULE_HOUR=${KPI_ROLLING_SCHEDULE_HOUR:-*}
      - KPI_CALENDAR_SCHEDULE_MINUTE=${KPI_CALENDAR_SCHEDULE_MINUTE:-0}
      - KPI_CALENDAR_SCHEDULE_HOUR=${KPI_CALENDAR_SCHEDULE_HOUR:-0}
      - KPI_BATCH_SIZE=${KPI_BATCH_SIZE:-100}
    volumes:
      - ./worker:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mtbf_network
    command: celery -A worker.celery_app beat --loglevel=info

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: mtbf_web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - mtbf_network
    command: npm run dev -- --host 0.0.0.0

  prometheus:
    image: prom/prometheus:latest
    container_name: mtbf_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - mtbf_network

  grafana:
    image: grafana/grafana:latest
    container_name: mtbf_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - mtbf_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  mtbf_network:
    driver: bridge
